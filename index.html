<!DOCTYPE html>
<html>
<head>
  <title>Vehicle Pass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- PAGE 1 -->
  <div id="page1">
    <h2>Vehicle Entry</h2>

    <input type="text" id="vehicle" placeholder="Vehicle Number" required>

    <select id="state">
      <option>Haryana</option>
      <option>Delhi</option>
    </select>

    <input type="date" id="fromDate">
    <input type="date" id="toDate">

    <button onclick="goToPage2()">Next</button>
  </div>

  <!-- PAGE 2 -->
  <div id="page2" style="display:none;">
    <h2>Payment</h2>

    <p>Amount: ₹<span id="amount">100</span></p>
    <p>Pay on this number: 9876543210</p>

    <button onclick="goToPage3()">Submit Payment</button>
  </div>

  <!-- PAGE 3 -->
  <div id="page3" style="display:none;">
    <h2>Processing</h2>

    <div id="countdown"></div>

    <button id="downloadBtn" style="display:none;" onclick="downloadPDF()">
      Download File
    </button>
  </div>

</div>

<script src="script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</body>
</html>
